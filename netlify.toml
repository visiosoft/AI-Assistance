[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

# API routes - redirect to serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Admin pages - serve directly
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# All other routes - serve index.html for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Function configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["src/**", "package.json"]

